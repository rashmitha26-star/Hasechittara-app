# Netlify Configuration File
# This tells Netlify how to build and deploy your app

[build]
  # Command to build your React app
  command = "npm run build"
  
  # Directory containing the built files
  publish = "dist"

# Redirect all routes to index.html for React Router
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Optional: Environment variables (you can also set these in Netlify UI)
# [build.environment]
#   VITE_RAZORPAY_KEY_ID = "your_razorpay_key_here"
